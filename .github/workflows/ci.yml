name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        # Auth.js v5 requires AUTH_SECRET to be present at build time.
        # This is a non-sensitive dummy value used only to satisfy the
        # build step in CI; it is never used to sign real sessions.
        env:
          AUTH_SECRET: ci-dummy-secret-for-build-only-do-not-use
        run: npm run build

      - name: Run unit tests
        run: npm run test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Check for E2E secrets
        # Fork PRs cannot read repository secrets. DB-dependent E2E (admin
        # login) is skipped there; the DB-free storefront E2E always runs.
        id: e2e-secrets
        run: echo "has=${{ secrets.DATABASE_URL != '' && secrets.AUTH_SECRET != '' }}" >> "$GITHUB_OUTPUT"

      - name: Start server for DB-backed E2E
        if: steps.e2e-secrets.outputs.has == 'true'
        # When both secrets are available, keep the database-backed server
        # for the admin flow and the storefront flow against the seeded DB.
        run: npm run start &
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          AUTH_URL: http://localhost:3000

      - name: Start server for DB-free storefront E2E
        if: steps.e2e-secrets.outputs.has != 'true'
        # Fork PRs and local-style CI runs must exercise the storefront's
        # static catalog fallback without inheriting a partial DB secret.
        run: npm run start &
        env:
          AUTH_SECRET: ci-dummy-secret-for-build-only-do-not-use
          AUTH_URL: http://localhost:3000

      - name: Wait for server
        run: npx wait-on http://localhost:3000 --timeout 60000

      - name: Run storefront E2E (no DB required)
        run: npx playwright test e2e/storefront.spec.ts
        env:
          AUTH_URL: http://localhost:3000

      - name: Run admin E2E
        if: steps.e2e-secrets.outputs.has == 'true'
        run: npx playwright test e2e/admin.spec.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          AUTH_URL: http://localhost:3000
